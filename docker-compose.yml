services:
  postgres:
    image: postgres:16-alpine
    container_name: propwise-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: propwise
      POSTGRES_USER: propwise
      POSTGRES_PASSWORD: propwise
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: propwise-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: propwise-backend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: propwise
      DB_PASSWORD: propwise
      DB_NAME: propwise
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis

  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: propwise-frontend
  #   restart: unless-stopped
  #   ports:
  #     - '3001:3001'
  #   environment:
  #     NEXT_PUBLIC_API_URL: http://backend:3000
  #   depends_on:
  #     - backend

volumes:
  postgres_data:
  redis_data:
