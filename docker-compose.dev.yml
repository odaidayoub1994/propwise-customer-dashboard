services:
  backend:
    build:
      target: dev
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      LOG_LEVEL: debug

  frontend:
    build:
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
